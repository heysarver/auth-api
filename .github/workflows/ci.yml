name: CI

# Validation only. This repository publishes no images: each consumer
# application builds its own auth-api image (see PR #181). The job here
# answers one question for a pull request: does this tree lint, compile,
# and pass its tests.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to the same patch release as the Dockerfile so a green run
      # and the shipped image agree on the runtime.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependency gate. It is enabled only now that the tree is
      # clean of critical and high findings; before SAR-1565 it would have been
      # red on arrival. Moderate and low findings do not fail this step.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Warnings do not fail this step. The tree currently carries 107
      # lint warnings and zero errors; a --max-warnings gate belongs in a
      # cleanup change, not in the gate that is supposed to unblock merges.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
