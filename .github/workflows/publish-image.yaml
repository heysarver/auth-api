name: Publish immutable auth-api image
"on":
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional exact release tag (vMAJOR.MINOR.PATCH); dispatch on that tag'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: auth-api-image-publish
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python .github/scripts/checks/validate_publish_image.py .github/workflows/publish-image.yaml
      - run: python .github/scripts/tests/test_validate_publish_image.py
      - run: python .github/scripts/tests/test_guard_image_tags.py
  publish:
    needs: validate
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: registry.sarvent.cloud/auth-api/auth-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release and Node version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, pathlib, re, subprocess
          tag = os.environ['GITHUB_REF_NAME']
          if os.environ['GITHUB_REF_TYPE'] != 'tag' or not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Publish requires a vMAJOR.MINOR.PATCH tag, not a branch')
          if os.environ.get('REQUESTED_VERSION') not in ('', tag):
              raise SystemExit('version input must match the selected tag exactly')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if subprocess.check_output(['git', 'rev-list', '-n', '1', tag], text=True).strip() != sha:
              raise SystemExit('Checked-out revision does not match release tag')
          package = json.loads(pathlib.Path('package.json').read_text())
          node = package.get('volta', {}).get('node') or package.get('engines', {}).get('node')
          if not node:
              dockerfile = pathlib.Path('Dockerfile').read_text()
              node = re.search(r'^ARG NODE_VERSION=(\d+)-alpine$', dockerfile, re.M).group(1)
          tags = [tag, sha, f'{tag}-{sha}']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version': tag, 'sha': sha, 'node': node, 'created': datetime.datetime.now(datetime.timezone.utc).isoformat()}.items():
                  print(f'{key}={value}', file=output)
              print('tags<<IMAGE_TAGS', file=output)
              print('\n'.join(os.environ['IMAGE'] + ':' + t for t in tags), file=output)
              print('IMAGE_TAGS', file=output)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.release.outputs.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Require Harbor credentials
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HARBOR_USERNAME" || -z "$HARBOR_PASSWORD" ]]; then
            echo '::error::Missing HARBOR_USERNAME or HARBOR_PASSWORD. Configure repository secrets for the auth-api Harbor project.'
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: registry.sarvent.cloud
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Refuse existing tags
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.sha }}
        run: python .github/scripts/checks/guard_image_tags.py
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: mode=max
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=auth-api
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.source=https://github.com/heysarver/auth-api
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
      - name: Record consumer digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
